[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-article-studio"
version = "1.4.2"
description = "GEO图文生产助手 — portable agent host-mediated execution layer"
requires-python = ">=3.11"
dependencies = ["Pillow==11.3.0", "jsonschema==4.25.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
documents = ["python-docx==1.2.0", "openpyxl==3.1.5", "pypdf==6.0.0"]

[project.scripts]
geo-article-studio = "geo_article_studio.cli:main"

[tool.setuptools.data-files]
"share/geo-article-studio/prompts" = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
